
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Кодты жүктеу
        uses: actions/checkout@v4

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Кітапханаларды орнату
        run: pip install -r requirements.txt

      - name: Код сапасын тексеру
        run: ruff check .

      
      - name: Автоматты тесттер
        env:
          PYTHONPATH: .
        run: pytest -q --cov=src --cov-fail-under=60

      - name: Құпия ақпаратты тексеру
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker контейнерін жинау
        run: docker build -t it-project-lab10:${{ github.sha }} .

      - name: Docker контейнерін тексеру
        run: docker run --rm it-project-lab10:${{ github.sha }}

      - name: Trivy қауіпсіздік тексеруі
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  deploy:
    name: Оқу стендіне орналастыру
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Кодты жүктеу
        uses: actions/checkout@v4

      - name: Docker образын жинау
        run: docker build -t lab10:latest .

      - name: Оқу стендінде тексеру
        run: |
          docker run --rm lab10:latest > output.txt
          cat output.txt
          grep -q "Өтінімнің басымдылығы:" output.txt

